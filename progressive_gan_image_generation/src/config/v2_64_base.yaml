seed: 42
device: cuda

model:
  name: progressive_residual_r3gan
  z_dim: 512
  image_size: 64
  expansion: 2
  generator:
    widths: [768, 768, 768, 768, 512, 256, 128, 96, 96]  # 9-stage; 512/1024 동일 width → to_rgb copy-init 유지
    blocks_per_stage: [2, 2, 2, 2, 2, 2, 2, 2, 2]
    cardinality: [96, 96, 96, 96, 64, 32, 16, 12, 12]    # width / 8
  discriminator:
    widths: [768, 768, 768, 768, 512, 256, 192, 128, 96]  # 256px~1024px D-heavy split
    blocks_per_stage: [2, 2, 2, 2, 2, 2, 2, 2, 2]
    cardinality: [96, 96, 96, 96, 64, 32, 24, 16, 12]    # width / 8

progressive:
  resolution: 64
  stage_mode: stabilize  # options: transition, stabilize
  stage_id: 64_base
  alpha: 1.0

data:
  train_root: /content/data/train_50k_256
  valid_root: /content/data/valid_10k_256
  test_root: null
  image_size: 64  # loader가 256 원본을 64로 resize
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  horizontal_flip: true
  cache_mode: shm_files
  normalize_on_gpu: false
  shm_root: /dev/shm/project02_train_256
  refresh_shm_cache: false

training:
  loss: r3gan
  total_steps: 15000
  grad_accum_steps: 1
  g_lr: 0.0002
  d_lr: 0.0002
  beta1: 0.0
  beta2: 0.99
  r3_gamma: 5.0
  ema_beta: 0.999
  amp:
    enabled: true
    dtype: bf16
    grad_penalty_fp32: false
  init_from:
    enabled: false
    checkpoint: null
  consistency:
    enabled: false
    weight: 0.0
  log_interval: 100
  ckpt_interval: 5000
  output_dir: checkpoints/v2/64_base
  resume: null
  resume_mode: strict
  fid:
    enabled: true
    interval: 2500
    num_real_images: 1024
    num_fake_images: 1024
    subset_seed: 1234
    batch_size: 64
    export_batch_size: 64
    dims: 2048
    device: cuda
    fail_on_error: false
    use_ema: true

sampling:
  num_images: 64
  nrow: 8

wandb:
  enabled: true
  entity: tmdgk115-sungkyunkwan-university
  project: osai-project02
  mode: online
  run_name: v2-64-base
